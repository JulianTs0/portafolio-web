000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="115" x="202" y="689.3794">solicitudGuardada</text><polygon fill="#A80036" points="59,719.5781,49,723.5781,59,727.5781,55,723.5781" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="53" x2="179" y1="723.5781" y2="723.5781"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="59" x="65" y="718.5122">response</text><!--MD5=[d260009b8401d0bb1b6472da1280bedb]
@startuml
title Diagrama de Secuencia - register

hide footbox

actor "Cliente/API" as C
control "SolicitudService" as SS
control "ContenedorService" as CS
participant "ContenedorRepository" as CR
control "UsuarioService" as US
participant "SolicitudRepository" as STR

C -> SS: register(request)

activate SS

note right: Validar solicitud en estado BORRADOR

group Try [Buscar Contenedor]
    SS -> CS: getByPesoVolumen(peso, volumen)
    activate CS
    CS - -> SS: contenedor
    deactivate CS

    SS -> CS: asignarCliente(idContenedor, idCliente)
    activate CS
    note right: Validar rol CLIENTE
    CS -> US: getById(idCliente)
    activate US
    US - -> CS: usuario
    deactivate US
    CS -> CR: update(contenedor)
    CS - -> SS: void
    deactivate CS

else Catch [ServiceError 404]
    SS -> CS: register(peso, volumen, idCliente)
    activate CS
    note right: Validar rol CLIENTE
    CS -> US: getById(idCliente)
    activate US
    US - -> CS: usuario
    deactivate US
    CS -> CR: save(contenedor)
    CS - -> SS: nuevoId
    deactivate CS

    SS -> CS: getById(nuevoId)
    activate CS
    CS - -> SS: contenedor
    deactivate CS
end

note right: Crear seguimiento inicial (estado BORRADOR)

SS -> STR: save(solicitud)

activate STR
STR - -> SS: solicitudGuardada
deactivate STR

SS - -> C: response
deactivate SS
@enduml

