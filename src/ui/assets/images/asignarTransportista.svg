;" x1="273" x2="412" y1="303.0469" y2="303.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="102" x="280" y="297.981">update(camion)</text><polygon fill="#A80036" points="279,328.1797,269,332.1797,279,336.1797,275,332.1797" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="273" x2="422" y1="332.1797" y2="332.1797"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="121" x="285" y="327.1138">camionActualizado</text><!--MD5=[980c7ed0a7918ca4bad14fc670b83132]
@startuml
title CamionService - asignarTransportista

hide footbox

participant "Cliente/API" as C
control "CamionService" as CS
participant "CamionRepository" as CR
control "UsuarioService" as US

C -> CS: asignarTransportista(request)
activate CS

note right: Validar camion existe

CS -> CR: getById(dominio)
activate CR
CR - -> CS: camion
deactivate CR

note right: Validar camion disponible

CS -> US: getById(idTransportista)
activate US
note right: Validar usuario existe y rol TRANSPORTISTA
US - -> CS: usuario
deactivate US

note right: Asignar transportista a camion

CS -> CR: update(camion)
activate CR
CR - -> CS: camionActualizado
deactivate CR

deactivate CS
@enduml

